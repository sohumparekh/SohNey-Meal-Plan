name: Android APK

# Builds a signed release APK and publishes it as a GitHub Release.
# Runs on every push to the app branch and on demand (Actions tab → Run workflow).
on:
  push:
    branches: [claude/household-meal-planner-bz8uhj]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      # No marketplace actions: plain shell with the tools already on GitHub's Ubuntu runner.
      - name: Check out
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Set up Node 22 and Java 21
        run: |
          NODE_DIR=$(ls -d /opt/hostedtoolcache/node/22.*/x64 2>/dev/null | sort -V | tail -1)
          if [ -z "$NODE_DIR" ]; then
            curl -fsSL https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
            NODE_DIR="$RUNNER_TEMP/node-v22.12.0-linux-x64"
          fi
          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          node --version
          java -version
          npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app and copy into Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f "$ANDROID_KEYSTORE_FILE"

      # Every release must carry the same signing key, or it won't install over the old app.
      # This is the key's public fingerprint (not a secret).
      - name: Verify signature
        env:
          EXPECTED_CERT_SHA256: b5def2411c12405805e725442f1a2f55313c5e8547a9cd50803834d0cfe55f6b
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signature.txt
          if ! grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" signature.txt; then
            echo "::error::APK is not signed with the household release key."
            exit 1
          fi
          cp "$APK" "ghar-ka-menu-$VERSION_NAME.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "ghar-ka-menu-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Ghar ka Menu $VERSION_NAME" \
            --latest \
            --notes "Android app, version $VERSION_NAME (build $VERSION_CODE). Install over the previous version: your data stays. Built from ${GITHUB_SHA::7}."
